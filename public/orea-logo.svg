<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 640" width="100%" height="100%" fill="none">
  <defs>
    <!-- Outer Blue-to-Cyan Crescent Gradient -->
    <linearGradient id="oreaCircGrad" x1="120" y1="360" x2="360" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B3B75" />
      <stop offset="30%" stop-color="#075FA8" />
      <stop offset="65%" stop-color="#0077B6" />
      <stop offset="90%" stop-color="#00A6C7" />
      <stop offset="100%" stop-color="#00C49F" />
    </linearGradient>

    <!-- Gloss Highlight Gradient for Inner Crescent Edge -->
    <linearGradient id="oreaGloss" x1="140" y1="120" x2="300" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Human Figure Gradient (Vibrant Royal Azure) -->
    <linearGradient id="oreaFigGrad" x1="260" y1="120" x2="310" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00A6C7" />
      <stop offset="35%" stop-color="#0077B6" />
      <stop offset="100%" stop-color="#075FA8" />
    </linearGradient>

    <!-- Emerald Leaf Gradient -->
    <linearGradient id="oreaLeafGrad" x1="300" y1="360" x2="420" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#007F8C" />
      <stop offset="25%" stop-color="#00A6A6" />
      <stop offset="65%" stop-color="#2BB673" />
      <stop offset="100%" stop-color="#63C96B" />
    </linearGradient>

    <!-- Golden Sparkle Stars Gradient -->
    <linearGradient id="oreaGoldGrad" x1="390" y1="90" x2="430" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F4B400" />
      <stop offset="100%" stop-color="#E29200" />
    </linearGradient>

    <!-- Letter O Gradient -->
    <linearGradient id="letterOGrad" x1="80" y1="460" x2="180" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0077B6" />
      <stop offset="50%" stop-color="#00A6C7" />
      <stop offset="100%" stop-color="#00C49F" />
    </linearGradient>

    <!-- Letter A Star Gradient -->
    <linearGradient id="letterAStarGrad" x1="440" y1="440" x2="470" y2="475" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F4B400" />
      <stop offset="100%" stop-color="#E29200" />
    </linearGradient>
  </defs>

  <!-- ==================== 1. CIRCULAR EMBLEM ==================== -->
  <g id="orea-emblem">
    <!-- Blue to Cyan Crescent (Letter O shape) -->
    <path
      d="M 270 365
         C 185 365 120 300 120 215
         C 120 125 195 60 300 60
         C 355 60 395 82 418 105
         C 405 112 388 108 358 98
         C 318 84 262 90 220 126
         C 176 162 168 218 192 270
         C 215 315 260 332 308 332
         C 324 332 332 342 320 352
         C 305 364 288 365 270 365 Z"
      fill="url(#oreaCircGrad)"
    />

    <!-- Gloss Reflection Arc on Upper Left -->
    <path
      d="M 165 145
         C 198 90 255 70 325 68
         C 292 64 238 70 196 102
         C 158 132 145 174 150 218
         C 150 188 155 164 165 145 Z"
      fill="url(#oreaGloss)"
    />

    <!-- Human Figure: Head -->
    <circle cx="305" cy="125" r="23" fill="url(#oreaFigGrad)" />

    <!-- Human Figure: Body & Upraised Arms -->
    <path
      d="M 242 120
         C 260 140 282 166 295 188
         C 292 222 278 248 268 270
         C 285 252 308 214 315 188
         C 332 162 356 132 376 96
         C 360 116 340 144 324 158
         C 316 138 308 122 300 110
         C 288 126 272 138 242 120 Z"
      fill="url(#oreaFigGrad)"
    />

    <!-- Green Health Leaf -->
    <path
      d="M 308 332
         C 345 326 385 296 410 252
         C 430 216 435 168 422 132
         C 412 174 390 220 356 254
         C 330 280 312 305 308 332 Z"
      fill="url(#oreaLeafGrad)"
    />

    <!-- Crisp White Leaf Central Vein -->
    <path
      d="M 324 312
         C 350 282 378 244 398 202
         C 408 184 414 164 418 144"
      stroke="#FFFFFF"
      stroke-width="3.5"
      stroke-linecap="round"
      stroke-opacity="0.92"
    />

    <!-- Brilliant 4-Pointed Golden Star at Top Right -->
    <path
      d="M 424 74
         C 424 88 431 98 446 98
         C 431 98 424 108 424 122
         C 424 108 417 98 402 98
         C 417 98 424 88 424 74 Z"
      fill="url(#oreaGoldGrad)"
    />

    <!-- Secondary micro-sparkle -->
    <path
      d="M 448 118
         C 448 125 452 130 460 130
         C 452 130 448 135 448 142
         C 448 135 444 130 436 130
         C 444 130 448 125 448 118 Z"
      fill="url(#oreaGoldGrad)"
      opacity="0.85"
    />
  </g>

  <!-- ==================== 2. WORDMARK "OREA" ==================== -->
  <g id="orea-wordmark" transform="translate(0, 0)">
    <!-- Letter "O" (Circular Ring with Cyan/Blue gradient) -->
    <path
      d="M 132 446
         C 132 478 106 504 74 504
         C 42 504 16 478 16 446
         C 16 414 42 388 74 388
         C 106 388 132 414 132 446 Z
         M 112 446
         C 112 425 95 408 74 408
         C 53 408 36 425 36 446
         C 36 467 53 484 74 484
         C 95 484 112 467 112 446 Z"
      fill="url(#letterOGrad)"
      fill-rule="evenodd"
    />

    <!-- Letter "R" (Navy Blue) -->
    <path
      d="M 158 390
         H 214
         C 238 390 252 403 252 422
         C 252 438 240 449 224 452
         L 254 502
         H 230
         L 204 456
         H 180
         V 502
         H 158
         V 390 Z
         M 180 438
         H 212
         C 222 438 230 432 230 422
         C 230 412 222 407 212 407
         H 180
         V 438 Z"
      fill="#0B2F5B"
    />

    <!-- Letter "E" (Navy Blue) -->
    <path
      d="M 276 390
         H 354
         V 408
         H 298
         V 436
         H 346
         V 454
         H 298
         V 484
         H 356
         V 502
         H 276
         V 390 Z"
      fill="#0B2F5B"
    />

    <!-- Letter "A" (Navy Blue Inverted Chevron with Golden Star inside) -->
    <!-- Left leg & Right leg meeting at apex -->
    <path
      d="M 444 390
         L 512 502
         H 487
         L 444 428
         L 401 502
         H 376
         L 444 390 Z"
      fill="#0B2F5B"
    />

    <!-- Golden 4-Pointed Star nestled in the interior of "A" -->
    <path
      d="M 444 454
         C 444 466 450 473 463 473
         C 450 473 444 480 444 492
         C 444 480 438 473 425 473
         C 438 473 444 466 444 454 Z"
      fill="url(#letterAStarGrad)"
    />
  </g>

  <!-- ==================== 3. OFFICIAL MOTTO / SIGNATURE ==================== -->
  <text
    x="300"
    y="548"
    text-anchor="middle"
    font-family=""Plus Jakarta Sans", system-ui, -apple-system, sans-serif"
    font-size="21"
    font-weight="500"
    letter-spacing="0.6"
    fill="#29476D"
  >Mieux comprendre. Mieux vivre. Mieux évoluer.</text>
</svg>